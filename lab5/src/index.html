<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>HotelManage — Бронирования</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="container">
    <h1>HotelManage — Управление бронированиями</h1>

    <!-- Форма: новая бронь -->
    <form id="booking-form" class="card">
      <h2>Новое бронирование</h2>

      <label for="booking-guest">ФИО гостя</label>
      <input id="booking-guest" type="text" placeholder="Иванов Иван Иванович">
      <div class="error" id="error-guest"></div>

      <label for="booking-room">Номер</label>
      <select id="booking-room">
        <option value="101">№101 «Стандарт»</option>
        <option value="102">№102 «Стандарт»</option>
        <option value="210">№210 «Апартаменты»</option>
        <option value="305" selected>№305 «Люкс»</option>
      </select>

      <label for="booking-checkin">Дата заезда</label>
      <input id="booking-checkin" type="date">

      <label for="booking-checkout">Дата выезда</label>
      <input id="booking-checkout" type="date">

      <br><br>
      <button type="submit" class="primary">Добавить бронь</button>
    </form>

    <h2>Список бронирований</h2>

    <div class="toolbar">
      <select id="status-filter">
        <option value="">Все статусы</option>
        <option value="new">Ожидает</option>
        <option value="in_progress">Подтверждена</option>
        <option value="done">Завершена</option>
      </select>
      <input id="search-input" type="text" placeholder="Поиск по гостю или номеру...">
      <button id="refresh-button">Загрузить с сервера</button>
    </div>

    <div id="info" class="message">Нажмите «Загрузить с сервера»</div>

    <table id="booking-table" hidden>
      <thead>
        <tr>
          <th>№</th>
          <th>Гость</th>
          <th>Номер</th>
          <th>Заезд</th>
          <th>Выезд</th>
          <th>Статус</th>
          <th>Действия</th>
        </tr>
      </thead>
      <tbody id="booking-body"></tbody>
    </table>

    <p>Броней на странице: <strong id="counter">0</strong></p>
  </div>

  <script src="js/mock-data.js"></script>
  <script src="js/mock-api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
